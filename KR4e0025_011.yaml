body:
  text: 胡仲子集後序孔子曰有徳者必有言夫言心聲也心㴠乎徳而言發諸口非能言之謂也是故君子之行道心茍得之言則發之得乎深者發之𢎞得乎精者發之確唐虞三代之盛聖賢並作徳之發於言者渾渾噩噩不可涯涘至孔子時格言大訓壹皆本乎徳之發則郁郁然彬彬然出其門者雖稍分其科終不愧乎孔子者也秦漢以來能言之士非不夥矣較於唐虞三代孔子之門則徳有慊焉逮及唐宋諸子間出得之既博發之尤醇使列聖之道晦而復明如日中天其亦無愧於孔氏之徒至今人樂誦而説聞之元氏有天下光岳之氣未分有徳有言者迭起其間亦一時文獻之美剛生也後不得聆諸老之謦欬而窺其徳之淺深嘗私竊為憾幸洒掃潛谿宋太史公及長山胡先生之門俱獲受其徳教太史公所得也深先生所得也精其言之皆確而𢎞者剛日諦玩之味於口飫於心而不敢釋諸身也國朝初太史公出握文衡居禁代天子之言言之發於徳者有集傳於世矣先生繼亦被召與修元史史成詔職詞垣以備顧問而力以疾辭重賜白金文綺俾歸振教鐸於姑蔑之郡未㡬復以老辭還處長山之陽一日盡以其所著書命剛曰吾老矣将以斯文授子子其勉之剛再拜受教惟謹先生蓄徳而著言本乎六經參乎史漢以及諸子訇乎其有聲炳乎其有光若明堂之朝嚴階陛盛冠裳而侯伯華戎之分截如也若泰壇之祀列陶匏燔牲玉而龍衮璪冕之容恪如也先生恒不以為足逮老而志不少衰每片言之出士林傳誦王公大臣爭虚左延譽以不得見為恨而天下學士仰之如景星卿雲将謂再起蒲車置於玉堂之署黼黻皇猷彌綸文化而整飭一代之言不幸先生以今年春正月九日卒於家於是慕先生之徳思誦其言有未得者咸相與欷歔太息剛也不敏安敢秘先生之言而靳其徳敬倣荀卿賈誼諸書文居詩賦之首編次成帙號胡仲子集通若千篇既請太史公序其端將與願學先生者同以為法而浦陽義門王氏復之父子徳先生之教言遂謀刋梓以傳王氏合食五世斯豈非其義舉歟洪武辛酉冬十一月望日門人同郡劉剛謹序胡仲子集後序
