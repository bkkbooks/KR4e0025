body:
  text: 胡仲子集别集類五明提要臣等謹案胡仲子集十卷明胡翰撰翰字仲子一字仲申金華人洪武初以薦為衡州府教授事迹具明史文苑傳是集乃其門人劉剛及浦陽王懋溫所編以洪武十四年刋板今印本罕傳惟寫本猶存於世凡文九卷詩一卷史稱其文曰胡仲子集詩曰長山先生集今合為一集豈剛等所併歟史又稱翰少從吳師道及吳萊學為古文復登同邑許謙之門今觀其文章多得二吳遺法而持論多切世用與謙之坐談誠敬小殊然嘗與修元史五行志序論即其所撰今見集中於天人和同之際剖析頗微犧尊辨宗法論諸篇亦湛深經術則又未嘗不精究儒理也詩不多作故卷帙寥寥而格意特為髙秀朱彛尊靜志居詩話曰金華承黃文獻溍栁文肅貫吳貞文萊之後多以古文詞鳴詩非所好以詩論吾必以仲申為巨擘焉獨孤及之論曰五言之源生於國風廣於離騷著於蘇李盛於曹劉漢魏作者質有餘而文不足以今揆昔則有朱絃疏越太羮遺味之嘆誦仲申五言正猶路鼗出於土鼓篆籀生於鳥迹庶幾哉升堂之彥乎宜潛溪有學林老虎文淵鯨之目也斯言允矣乾隆四十二年八月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀胡仲子文集原序韓退之抗顔師一世自李習之以下皆欲弟子臨之而習之謇然不甚相下崇言正論往往與退之角其復性平賦二書修身治人之意明白深切得斯道之用蓋唐人之所僅有而可與退之原道相表裏者也濓嘗以為習之識髙志偉不在退之下遇可畏如退之而不屈真豪傑之士哉古之君子其自處也髙其自期也逺其自視也尊其擇師與友也審舉天下無足慊意者則求古人之賢者而師友之茍有得於心矣當時知否不恤也身之貴賤弗論也行之為事功宣之為言論一致也其心廓然會天地之全而遊乎萬物之表視古今如一旦暮視千載以上之人若同堂接膝而與之語何暇以凡近者纍其心乎孟子舍子思之門人而願師孔子非遺其師也道冝然也近世學者鄙陋而無志聞古之人畏之如雷霆鬼神不敢稍自振僕僕焉於庸常之人師云師云而卒無所成者皆習之之所棄也吾友胡先生獨不然自其少時誦數十萬言在諸生中已驚動其鄉邦老儒咸畏而敬之及其既長而壯竒邁卓越務師古人出言簡奧不煩而動中繩墨如夏圭商敦望而知其非今世物也同郡大儒若吳貞文公立夫先生嘗師事之吳公亟稱其才不置黃文獻公晉卿以文學名天下見先生輒延致共語所以期待者甚隆而先生亦不為之屈也諸公既亡先生之學益成行益修德愈劭而文愈雄大江之南稱賢者必曰先生而先生不自以為至也今天子有國之初大臣交薦先生才行上憫其老不欲重煩以政命為衢州教授會修元史復薦入史館史成賜金帛遣歸或謂先生未展其所學而先生淡如也先生嘗慕邵子程子之為人所養甚深極乎博而守則約務乎大而不遺乎細於人鮮所推讓而所許者衆必以為賢於言不輕發而所言者人必以為當其所著衡運井牧皇初諸文有習之之辭而所得者非習之所及也先生年未老而文已傳於時獲讀之者莫不知其為可貴然其可貴者豈特文乎哉是則先生之自得者世之人未必能知雖濓亦不能盡其詳也濓與先生同師於吳公相友五十餘年髮秃齒豁矣見世之士多矣心之所仰而服者惟在先生則先生之文豈獨今之所難遇乎學子劉剛撰次成集而王君士覺為圖其傳來請序濓不讓而書其首篇所以嘆先生之善學而幸天下之見其文也先生名翰字仲申金華人仲子其號云洪武十三年秋八月癸酉前翰林學士承旨嘉議大夫知制誥兼修國史兼太子贊善大夫同郡宋濂序
