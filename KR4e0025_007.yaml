body:
  text: 胡仲子集卷七明胡翰撰深溪王氏祠堂記古之祭者大夫之家祭於廟庶人之家祭於寢士猶大夫而殺焉禮也未有祠堂也祠堂始於漢不過即墓所為之禮之變也宋儒去墓而營於家則變而協諸義也古者士有祿位後世之士無祿位茍無祿位則庶人耳不得有廟以賢人君子欲致崇極於其先而下同庶人亦淆矣以公卿大夫之後髙門巨室欲致崇極於其先而下同庶人又淆也何貴於士乎於是而有祠堂之制以廟則不僭以寢則不褻而於士為稱深溪王氏郡著姓也宋太祖之世其先有策勳為金吾衛上將軍封邠國公贈尚書令者理宗時有以進士登科言事動朝廷拜監察御史致仕太常少卿諡忠惠者其别出之族有為尚書為丞相者蟬嫣烜赫後先多矣而忠惠之從子處棠顧獨不樂仕進徙居深溪營資産以善慶遺其子孫子孫遵之力於封殖五世而至善淵處士澄誕建有家篤於孝友今五世矣合族以居積數十年而族益熾且蕃則又大新其室廬規地正寢之東首建祠堂用妥其先世之靈始自髙祖不敢逮及邠國者逺故也髙祖有服則當祭非僭也其次則曾祖及從曾祖又其次則祖及從祖繼祖為禰禰之昆弟及從昆弟族合則祭亦合非褻也月朔必謁有故必告嵗時奉其明薦罔敢或怠以粢盛醴齊牲殺器皿不可無田以給也則置祭服凡禮之得為者視其力而為之其不得為者則弗為也既協諸義其長士覺猶懼來者不知所以報本始之意介余友劉剛養浩來請記余嘗觀於易之渙萃見祭祀之足以感人心為天下至大而人民至衆也人各有心孰能萃之惟祭能萃之渙而異心者可萃也則生而同氣者宜若之何哉士覺於斯豈惟足以昭格祖禰之神尤足式孚乎孫曾之心矣孫而又子子而又孫致其孝享合精聚神猶一人可也同居不異㸑猶一日可也寧有替乎存乎其人耳余客浦陽間獲與剛過士覺家少長序立左右熟視之慤如也終日而退言語若不出諸口於是知王氏之世德有不在貴顯者知其將事其有足觀者乎昔朱子敘家禮欲略浮文務本實竊附孔子從先進之意余於王氏亦以是云俾書諸麗牲之石知本堂記國家營新城於諸暨常栖重兵命省臣有文武長才者鎮之於是參政胡公往踐其任數年之間令行化孚人用和輯公乃因其餘力構堂曰知本而居之未幾移鎮來杭朝廷加公行中書左丞新城之堂蓋廢矣則又即所寓而扁焉以新城往時陳剛之記俾復述以記夫今堂余觀天下之物基厚者積必髙源深者流必長盛德之興其後必大昔越國公畢生效力於社稷有開國之功有庇民之德身不食其報而遺裕在其後昆公實承之朝廷嘉念越國衍錫封之典厚任子之祿殊恩顯秩萃於一門焜耀當世公實承之此宜夙夜不能己其惓惓之心也是堂之作其名蓋有由然矣夫以燕處之私不忘其所始則其於蒞官必莊矣戰陳必勇矣豈有非孝不忠之事乎故家有嚴君由之以生者謂之父母左右就養服勞至死可也天下有王由之以立者謂之父母左右就養服勤至死可也而又有大父母焉雖吾君吾親皆資之以始所謂萬物本乎天者是也就之而不可得奉之而無所致其力君子於此蓋難矣今剛推言功業本於仁義仁義本於心心本乎天是之謂知本孰從而求之滋不易矣天體物而不遺吾以為君親皆天也臣子日用之所當為者孰使之天使之也天性在物雖穴處肉食之蟲獸猶將知之何獨至於人而知之乎故曰忠臣以事其君孝子以事其親其本一也一者何天而已矣知所以事天則知所以事親矣知所以事親則知所以事君矣反而求其本亦曰敬身焉耳詩書稱君牙世篤忠貞召虎肇敏戎功人孰不以此望之公乎尚允蹈之不然則余徒有言也亦末矣清風樓記赤松寶積觀之西廡有曰沖和道院者道士倪天申趙子安居之其先師曰竹林王君王君之師曰石泉趙君皆以詩名方外元貞初石泉與其徒嘗構閣曰松花逮今六十餘年天申子安又即松花之後為樓髙三丈有竒橫闊與深皆五丈有奇工既訖事取竹林所謂清風集者因以名之而藉吳君德基屬余記焉古稱金華山一名長山袤延數千里至赤松而風氣融會丹崖翠壁環合為一澗水汨㶁並山曲折若左右顧而去晉黃初平牧羊山中即其地也今靈迹故存觀之廬舍聨絡錯峙各擅其勝而是樓冠之吾嘗與德基登覽其上見山之諸峯髙者竦而側者跂前者伏而後者赴矯若鴻驚抉若猊怒拱若人立而植圭璧欲遽數之不暇晨霞夕靄晦明吐納大松數千百章柯葉彌布如車蓋它竒木異草往往非人世間物可服餌也山雨日出春爽芬烈之氣襲人其北修竹萬個如碧雲蒼雪歷寒暑而不變望之有太古之色不敢狎也禽鳥嚶鳴薈蔚中鸛鶴決起清風颯然于于徐徐而來不暴不曀翏翏刁刁而草木動澗谷應雜若琴瑟笙築引金石而考之乍鳴乍止余乃顧謂子安曰美哉風乎往來升降於兩間而浮遊回薄乎四時之序可以鼓大化舉大物人卒遇之可喜可愕可悲可慨其變不窮而孰吹噓是孰槖籥是吾與子皆不得而知也臨爽塏之地處廣埌之野臺焉而觀川焉而遊鼓南薰挹西灝疏瀹世之汙濁由是以快一時之懷則人得取而樂之也天下之物人得而取之故吾取之也莫與之爭人得而樂之故吾樂之也無有不足今登子之樓俯仰山水之間披襟而坐飄若蟬蛻而撫有宇宙者恆以是也故人皆物乎物而吾獨與造物者遊世言神仙好樓居將不有泠然從寥廓而至者乎吾慕其人久矣不及見之而偶獲與二子相從於方之外天申願而朴子安敏而好修皆能成其師之美者余每過之子安輒留就飲舉大白引滿劇談大笑視其鬚髯墨如也或疑其為神仙云悅親堂記越國胡公之鎮金華也其內弟馬克敏實𨽻麾下間請於公願輟行伍迎母以致養焉公聽之今十餘年矣將治裝歸淮南告於媯仲子曰含山吾土也罹兵革之變吾兄弟三人者舁母避亂廣陵未幾兄弟俱沒煢焉罔知攸濟天下棄吾母子渡江而南惟越國是依以至於今日復值海宇混一朝廷詔凡臣庶播遷者悉歸其鄉土復故版籍吾將入籍為含山之民矣奉吾母行且有日願先生教之則吾雖不獲與諸將驅馳出死力以取功名如世所謂豪傑退而沾被聖化不失孝友之稱於鄉人是亦先生之賜也媯仲子曰夫士之去其鄉猶大夫之去宗廟諸侯之去社稷也豈其所欲哉不得於君則去之國有故則去之未有若今天下之變父子兄弟不得聚廬而處者皆是也殊鄉異井資濡沫以全活不為人俘虜則幸矣欲保右有家孝養厥母甘旨輕暖之奉適於口體優遊朝夕之間不知安土之既久而陟岵之可悲此千不冀一也況大兵之後復覩太平之盛遄歸舊鄉紹復其先世之業親戚故人相賀於閭拜母於堂舉酒為夀何啻骨而月之以獲更生此萬不冀一也而吾於克敏見之克敏歸矣吾聞含山故龍元縣有彭山之勝東關之阻風氣去中土不逺魏晉以來南北豪傑之戰爭往往皆在其地而今莫不鞠為丘墟榛茀所生鳥獸所萃霜露蒙翳一顧蒼莽欲求其故漫不可識則凡富貴功名人生待之以為榮恃之以自託於天壤者果何如哉故君子之道不以天下之重易吾性之所貴生而有知則知愛其親矣不幸而遇變幸而不失其常皆天也天以是厚於子而子弗求盡其道不可也盡其道者誠身而悅乎親也吾何加乎哉請徴諸孟軻氏之言以悅親名其堂而歌之云輪乎奐乎吾何美乎願以致吾養乎母夀且康樂有孫子乎安樂窩記東陽多大族子孫能亢其宗者有蔣氏焉蔣氏居橫城南溪間而南溪之族兄弟四人長曰伯康次曰仲啓曰叔夏曰季髙其先君子晦父棄諸孤之日藐焉皆幼也惟母夫人延師教之未幾皆踔踔能自樹立曰吾豈以吾父不存而貽母憂哉凡可以悅其親者必致謹焉其後伯康三弟又即世伯康曰吾豈以吾弟不存而貽母憂哉凡可以悅其親者益致謹焉今母夫人七十有餘嵗矣麑冠鶴髮顔色愈愈然飲食起居晏晏然於是伯康規堂之西為室於池水之上取古之善事親者善事舅姑與夫者列而繪之室以備監戒既成則奉其親居焉曰吾親老矣幸而安於斯樂於斯矣不可以他名也遂名之曰安樂窩又以安樂窩者康節邵子之室嘗有是名也今襲之不韙乃諗於其先友范景先景先曰在禮有之樂其心不違其志樂其耳目安其寢處以其飲食忠養之孝子之事也襲乎襲何為而不可乎伯康因介景先屬余以記之君子不沒人之善余雖不敏猶願執筆以從君子之後乃言曰若昔邵子之居洛其寢室不過美惟求冬燠夏涼遇有睡思即就枕此其為安樂者乎則天下之處子皆得而有矣不然則弄丸餘暇間往間來有不得而與之者乎則天下之至理亦嗇矣邵子求學於古今盡古今之情求學於天地盡天地之情非私於有我者也茍不私於有我則其所謂安樂者天下後世人得而同也獨伯康乎今天錫子之母以眉夀又康寧無恙是亦一安樂也子更多故而能奉其親飲食寢處不違膝下是亦一安樂也今取之以名是室豈人子之私哉循乎天而已始余從文懿許公識伯康之先君子沉厚長者禮致師儒方規為義孰紹復其先世之舊有志不遂及季髙登黃文獻公之門余復見之方著問學然亦不遂後先數十年見其父子如此而余亦遂老矣何幸於兵燹之餘又見吾伯康之獨亢其宗哉恆欲周遊兩峴訪其故家餘俗過南溪謁吾伯康盡發其先世藏書以足吾平生所好患未能也伯康幸終惠之吾聞孝子不過乎物仁人不過乎物此孝之大者純善若邵子可也伯康幸加勉焉不有得於余言則有得於景先之言矣余固將登子之堂執爵以為母夫人夀滄洲趣軒記有為希夷之學者曰一山外史隱居赤松之山作軒於池上既落成矣問名於客客巧歷之靡適於可也久之而有亟圗來者發而視之則上清方壺子所寫滄洲趣也乃以名其軒而求記於媯仲子其言曰吾軒廣十餘楹疏其前以為池周亘百數十步於勢劣矣而有不可為畛域者焉月往而規燬日入而魄淵天光下燭雲影相涵與夫山之草木水之鱗介莫不往來隱見於空明之中而蕩摩浮動於几席之上吾坐而挹之豈不猶洞庭之野具區之澤煙消雨霽漁人舟子散而之乎東西浟湙淡濘一碧千頃而天隨玄真之屬傲睨乎其間也吾循池左右列為小廡四阿相承以屬乎南而南廡之外則金盆上霄諸峰之水合流而西洄洑兩崖之隙出乎舄履之下卒與石遇鳴聲參發小者瀺灂大者澎湃雷霆駭乎前雪霜變乎色相禪於晝夜之間吾卧而聽之豈不猶江河溟渤潮汐生而波濤作大風鼓之神物馮之矗起千仞變化頃刻目不敢注聽不可極而安期羡門之流乘蹻而自適也故吾雖處乎一山之中一軒之內而浩乎有滄洲之趣子以為奚若仲子曰天下之美患不能兼而有之抗志幽敻者其居奧矣而不知江湖之為大寄懷夷曠者其視宏矣而不見山林之為阻今子欲兼之乎余聞道家有十洲者而滄洲不與焉昔東方朔隨師之主履中旋十洲亦未嘗及是也朔之後數百年而後謝眺知之又數百年而後杜甫知之二子者發之歌咏亦不能有也則所謂滄洲者果安在哉物生於無始名出於所寓方其未有物也玄黃溟涬而未芽且孰為天孰為地而孰為子之洲乎及其判而有物則天積氣耳地積塊耳以積塊而浮遊於昆侖旁薄之中則大地亦一洲也人生長休老於其間不自知之而求之魚龍不測之淵思若至人者與之居終古不得矣否則擬諸尋常詞翰之末自謂足以盡天下之妙去道亦逺矣故朔也眺也甫也皆未得為至也汝南之壺飲者樂之巴卭之橘奕者安焉是故無小無大無逺無邇其趣一也試觀於止水聽夫鳴泉動靜相涵而孰使之天下之物莫不皆然又孰從而有之此希夷之道也微之又微搏之不得名茍得其趣則方壺之圗寓也子之軒亦寓也而吾為子記之亦寓也將混而為一而問諸祖洲之人焉白雲亭記距婺之東百有五十里其邑為東陽未至邑四十里其鄉為懷德其山有曰八華山者故文懿先生講學之所也山之麓邑人許氏居之其兄弟曰和伯曰晉仲自以其生也晚不及登先生之門幸嘗私淑諸人與有聞焉顧瞻遺躅流風餘韻又幸而未泯山川草木猶將被其榮矣則吾寧能已其興起之情乎乃作亭山中書其匾曰白雲亭白雲者先生故所自號也因其自號而匾之尚德也余聞之許氏乃記之曰儒者之學尊本明統宋南渡以來朱子嘗以是傳之黃文肅公文肅傳之何文定公文定之後王魯齋繼之金仁山又繼之至先生蓋五傳矣延祐乙卯丙辰之間天下承平諸公貴人方事文治聞先生名者爭欲辟致為時用先生固辭而侍御史趙公宏偉自金陵寓書願率弟子以事先生先生留金陵踰年乃歸從遊者益衆以目眚不能見客遂屏迹山中諸生贏糧笥書從者如故去湫隘而就爽塏暢湮鬱而挹清淑境與心會業以專工固一時之盛也先生既沒門弟子又自為學逮今未六十年何其微也惟兹山表著郡邑蒼莽百里間余翹而望之欲從和伯訪其故躅曽不能一至焉若先生之門則嘗灑掃矣方年少氣鋭聞其所聞而莫究其所以聞也見其所見而莫究其所以見也又況其不得聞不得見者安能有諸身乎事往而世已殊志存而力不逮今老矣獨不能己者何哉萬物同宇以生而人在天地猶一物耳自幼至老大都不過百嵗而百嵗在天地猶須臾耳以須臾眇焉之生而欲並天地以立與天地以為終始者豈有他哉惟盡夫人所以為人之道焉耳人之所以為人之道其理命於天所以為性者五著於人所以為倫者五明而誠之皆吾固有者也雖先生之受於仁山仁山之受於魯齋上泝朱子之傳有不得窺者豈能外是以為教乎由朱子等而至於河南二程子又等而至於先聖人孔子豈有異然乎故曰以一物觀萬物以一世觀萬世者聖人也聖也者人之至者也人也者物之至者也知其至而至之吾雖不能以一觀萬然去先生未逺其道可識也和伯之所尚固有不能己者矣和伯之弟晉仲與余生同嵗學同志又與余友吳君德基先生之仲子存禮相友善他日登斯亭二三君子試以余言觀之則凡興起其髙山景行之思者不假他求而得之矣故余於其登覽之勝風物之美不暇托而書焉煮石山房記吾鄉棄以誠寓於醫而以煮石名其山房山之人間而訾之是何惑也天食人以氣地食人以味總總焉而生噍噍焉而食於是有稻粱果蔬水土之品以為饔飱醯醬菹蒲也有牲牷魚鱉鳥獸之肉以為殽胔醓醢脯鱐也皆養生之具人所同也今棄人之所同養而取諸石焉是以平墄砥礪之胚而擬乎簠簋籩豆之實也以瓌詭殊特之觀而等乎滫􅔱甘旨之饋也雖修火之利均水之劑旦旦而湛熾之何足以饜飫人哉於術亦左矣竊為以誠不取也或從而釋之何訾之過乎聖人貴無體之禮無聲之樂庸知天下不有無味之味乎太山之磷是為雲母熬之以玄水漬之以秋露可液而飲也苻陵之砂狀如夫容粉而內之瓷釡取紫背烹之三伏可粒而食也若是者蓋多矣故八石五母亦至人之芻豢也並天地而生非若草木之華實鳥獸之脂膏嵗一計而月一取也故衛生者資之非直已人之疾起人之死固將久視天地而不老也古固有為之者矣何獨至於今而異然乎以誠多禁方其必有所受矣以誠曰允若人言是欲韓伯休我也吾嘗曳逢掖之裾於公卿之門人不我虞也而今修刀匕之劑於三家之市又何求哉竊觀於唐人韋應物之詩而悅之不知其頥之解而顛冥也請質諸媯仲子仲子曰大道裂而百家之言興其淆也千百嵗矣天下無白不可以視石天下無堅不可以謂石物白焉無定白物堅焉無定堅惡甚石也吾以公孫龍之言為幻矣比嵗居金華山聞有黃氏子初平者又幻於龍也其人牧堅耳能叱山之石以為羊惜無薪蒸世不得染指焉以誠求之幸置棗脯齋祓而候諸山房之扃將見其人矣試以余言似之母久事狡獪吾有蹲鴟旦來啖之毋使人擬汝於觙也樗菴記浦陽趙氏由宋至今為邑望族而彥嘉尤良謹能交遊四方賢士與媯仲子為世契仲子嘗踰長山往過其家山中有大木有若栲若椿者焉問諸山之人莫之知也至於邑郛彥嘉舍客而餉之仲子語以故吾見大木有若栲若椿者山之人弗我告此何木也彥嘉曰是其大本擁腫者乎小枝拳曲者乎此散木也吾菴嘗取以名之莊周氏所謂樗者是也仲子曰吾辱交於子之門少則從子之曾大父大父遊既而奔走世途間又從子之父子遊周旋進退庭戺間五十餘年闕者闕者闢闕者拱矣先世封殖宜有嘉樹如王氏之槐田氏之荆安闕之散闕若栲若椿者且吾觀之又未始有也將自託於莊周氏則子之家著孝慈子弟慎禮節生産力業益又豐衍矣人皆知子之才也何居乎彥嘉曰待物以為足者徇外而忘內也持已而不知戒者見利而忘患也吾豈藉夫擁腫拳曲者以為吾輪奐觀美乎吾豈自詭不欲人之規矩繩墨我乎吾豈莊周氏之徒乎以吾悵不諧於俗俯而就之則矯固而執之則倨矯與倨君子不由也不若去智而任闕去術而任情彼以我為散也闕不求用於我不責備於我庶若樗之全盡其天年乎此吾志也先生何索我之深哉仲子曰物以才而貴以非才而賤以有用而伐以無用而全故楩楠豫章杶幹栝柏檖梓之屬世謂之文木樗櫟榕榖之屬世謂之散木文木大者為棟梁為樿傍小者為榱桷為棖闑其用不可遽計是宜貴也散木大不中繩墨小不中規矩求棟梁樿傍者無所用之求榱桷棖闑者無所用之匠者不顧是宜賤也才而貴也而或伐之不才而賤也而或全之是才不如非才也貴而用也而或有故而舍之賤而非用也而或不虞而災及之是才猶愈於非才也物之相形何算哉此養生之所以難也莊周氏得其一焉彥嘉氏得其一焉仲子則異矣天之生才非一朝夕而生也非一朝夕而成也合衆才而言之其虧成不同其所負者異也舉一物而例之其虧成不同非其所負者異也物有幸有不幸也人之所遇或幸或不幸皆天也君子不二所以事天也人皆知有用之用而不知無用之用知無用之用而不知有用以無用為用有用者才也以無用為用者德也德崇而道立是不惟禔爾身且裕爾家用燕爾子孫矣故曰十年樹之以木百年樹之以德彥嘉其樹德乎或曰否彥嘉善醫其取諸虎目者能己人之疾是在炎帝之經子與莊周亦夏蟲耳彥嘉笑而謝曰何言之嵬也請書以為吾菴之故實俟夫志博物者辨之為善堂記宋先生景濓既辭翰林之職今年朝於京師而歸余過闕見之相與道舊故者纍日將别復謂余曰吾兄景闕於故所居潛溪之上取闕人之辭名之曰為善諸友記之矣惟子闕可無以慰吾兄余謝曰先生觀於天下之義理闕取徒為侈大嘗徴諸易一隂一陽之謂道繼之者善也成之者性也天以是命於人人具有之當為而為之者君子也不當為而為之者小人也故君子為善不求知於人不冀報於天余嘗於其微而見焉方少壯時先生與余自城府抵其舍於是獲拜先生之大父贈太常少卿者塈其先君贈禮部尚書者頎然而偉朴然而古終日侍坐不妄交一語語即其平生所歷不及他事舉酒共酌歡然就醉人不見其惰容莫不以長者目之與其族人居族有犯之者不較也與其鄉人處鄉有犯之者不較也恬然無幾微眥睚意鄉人藉其資力自視以為得志不知公固長者也先生時在家庭方業儒出所學奮不顧人之是非人益以為迂濶余雖戅雅尊事之敬禮之天不與善人則已茍與之其必有達者歟逮今五十年遭值國家革命訪求儒雅先生遂應聘而起敷其碩學潤色鴻業天子嘉其能推恩及其先人龍光所燭昭若日月於是先少卿先尚書之厚德純行鄉閭以為不及事者人皆識其可尊自九重襮於天下善積於人之所不知而驗於天之所由定埀示子孫以為明訓豈若庸人徼一旦之幸不再傳而遂無餘裕者哉故曰德厚者流澤光德薄者流澤卑德之厚薄存乎其人善進而不已則薄者可厚善畫於自止則厚者可薄余與先生老友也而景淵又生同嵗余視之猶先生也有言烏得不盡故願堅晚節如少壯時不忘昔人任重道逺之意斯為美矣香溪仁惠廟禱雨記洪武十有一年夏六月不雨環郡之邑厥田髙者㸑圻下者剛燥陂澤既竭原泉不通稼日就稿農民告病郡邑修禱祀之禮籲天叩神或應或否而旱熯如故洎秋七月不雨農民告病益急從政者患之蘭溪距郡五十里其邑旱不為災踰邑而西又二十五里為香溪入其疆則其澤之竭者演而注其土之焦者淖而沃田間芃芃皆美稼也余為愕且喜問諸父老皆曰先是固旱矣農告病矣賴吾司征之長吉安劉君思忠而免於歉乃六月己丑君率父老禱於里之偃王廟合百神而享之明日丙寅入蟠山禱於天津廟廟故有大神曰澤潤曰澤沛蓋司龍者也迎而致之及途而雨越三日戊辰又大雨猶未洽也七月癸酉君露跣道上禱之益虔明日甲戌神應之以雨越三日戊寅又大雨吾稼仰之以足靡不就實是則神之賜也君之貺也吾民戴之每食恨不尸而祝焉余聞而愈愕劉君非有民社者曷為而及是哉既而過友人之門陳如圭氏吳德璋氏皆曰誠如父老言然不寧惟是往年禱雨脫我於藴隆之毒亦惟君慺慺以將事吾懼無以報之則著為咏歌之辭而今又重蒙德焉其感而應也灼有攸徴矣向使吾二人言之人孰信之使吾鄉人言之雖信而未必深也今先生幸辱臨兹土而寓目焉咨及下走走不敢隱懼余言不足以侈君之貺不於先生圗之而孰圗之先生茍不鄙夷得託諸文字庶其傳信矣乎余謝而退他日童良仲至郡則具其事以請春秋譏不閔雨而著喜雨善其有志於民也今郡邑猶古侯伯之國從政者孰不有志於民寧風旱逆時雨凡禮之所當為者悉致力焉而猶莫能致其所難必劉君一司征耳其職不過𣙜貨財督稅課取諸商賈之類與郡邑有民社者異矣顧不忍農人之無稼殫厥心而拯之天亦輒應之豈有他哉宇宙分事即吾分事昔江西陸子嘗有是言君固習聞之矣況其近者一視同仁而無間可也天之仁愛吾民恆欲厚其生不幸而丁斯之旱豈使之無孑遺哉故一夫致其格一鄉遂其育積誠之至則天心順成之矣余取鄉人之言論著君之美以見喜雨者能閔雨也不臨民而有志於民尤所善也此春秋之義是宜書之以告來者胡仲子集卷七
